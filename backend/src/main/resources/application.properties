spring.application.name=PortfolioPro

# Database Configuration (Dynamically resolved by DatabaseConfig: supports Render PostgreSQL, MySQL, or cloud H2 fallback)

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

server.port=${PORT:8080}

# Twelve Data Market Data Provider (Provide key via environment variable or default)
twelvedata.api.key=${TWELVEDATA_API_KEY:your_twelvedata_api_key_here}
twelvedata.base-url=https://api.twelvedata.com

# Google OAuth2 Authentication (Provide credentials via environment variables)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id_here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT Security
jwt.secret=${JWT_SECRET:your-super-secret-key-that-is-at-least-32-characters-long}
jwt.expiration=86400000
